services:
  - type: web
    name: technobytes-backend
    runtime: python3.12
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: HOME_AFFAIRS_API_BASE
        value: www.omnicheck.co.za/webservice  # Replace with actual API base URL
    databases:
      - name: technobytes-db
        databaseName: technobytes
        user: technobytes_user
        plan: free